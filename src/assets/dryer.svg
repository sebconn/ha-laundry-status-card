<svg viewBox="0 0 150 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <rect x="5" y="5" width="140" height="190" rx="10" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Control panel -->
  <rect x="15" y="10" width="120" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="35" cy="25" r="5" fill="currentColor"/>
  <circle cx="55" cy="25" r="5" fill="currentColor"/>
  <circle cx="115" cy="25" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Door outer -->
  <circle cx="75" cy="125" r="55" fill="none" stroke="currentColor" stroke-width="3" class="door-outer"/>
  <!-- Door inner (status fill target) -->
  <circle cx="75" cy="125" r="45" fill="var(--status-color)" stroke="currentColor" stroke-width="2" class="door-inner"/>
  <!-- Lint trap detail -->
  <rect x="60" y="105" width="30" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"/>
</svg>
